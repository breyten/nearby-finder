<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Finder - Find Nearby Places</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📍 Location Finder</h1>
            <p>Find breakfast, coffee, lunch, dinner, and beer places near you</p>
        </header>

        <div class="controls-section">
            <div class="controls">
                <button id="geoBtn" class="btn btn-primary">📍 Get My Location</button>
                <input type="number" id="radiusInput" placeholder="Radius (meters)" value="1000" min="100" max="10000" step="100">
            </div>

            <div class="categories">
                <button class="category-btn active" data-category="coffee">☕ Coffee</button>
                <button class="category-btn" data-category="dinner">🍴 Lunch/Dinner</button>
                <button class="category-btn" data-category="beer">🍺 Beer</button>
                <button class="category-btn" data-category="tourist_attraction">🏛 Things to do</button>
                <button class="category-btn" data-category="atm">🏧 ATM</button>
            </div>

            <div class="sort-section">
                <label for="sortSelect">Sort by:</label>
                <select id="sortSelect">
                    <option value="relevance">Relevance (Rating)</option>
                    <option value="distance">Distance</option>
                </select>
            </div>
        </div>

        <div class="location-display" id="locationDisplay" style="display: none;">
            <p>📍 Your location: <span id="locationCoords"></span></p>
        </div>

        <div id="loadingSpinner" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Searching for locations...</p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div id="resultsContainer" class="results-container">
            <p class="no-results">Select a category and search to see results</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
